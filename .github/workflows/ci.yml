name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Sync (frozen)
        run: uv sync --frozen

      - name: File size (<= 150 code lines, src and tests)
        run: uv run python tools/check_python_loc.py

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy --strict

      # Linux runs every test there is, including the two-process exact-six
      # series. Windows runs the same suite minus the one documented native
      # stall, which the job below runs on its own so it stays visible.
      - name: Tests + coverage (fail under 90%)
        if: runner.os != 'Windows'
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=90

      - name: Tests + coverage (fail under 90%, excluding the known limitation)
        if: runner.os == 'Windows'
        run: uv run pytest -m "not windows_known_limitation" --cov --cov-report=term-missing --cov-fail-under=90

      - name: Build
        run: uv build

  windows-known-limitation:
    name: Windows native exact-six known limitation
    runs-on: windows-latest
    # Non-gating on purpose, and never hidden: the native Windows two-process
    # exact-six pair reproducibly stalls at the g01 step-22 acknowledgement and
    # the investigation is closed (see docs/architecture/CONCURRENCY_MODEL.md).
    # The test is neither deleted nor xfailed - it runs here in full view, and
    # its log is the record of whether the limitation still reproduces.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Sync (frozen)
        run: uv sync --frozen

      - name: Native two-process exact-six
        run: uv run pytest -m windows_known_limitation --no-cov -rA
