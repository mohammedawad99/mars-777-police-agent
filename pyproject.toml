[project]
name = "mars-777-police-agent"
version = "1.0"
description = "Police agent (group MaRs-777) for the 2026 Distributed Police-Thief P2P final project."
readme = "README.md"
requires-python = "==3.12.*"
license = { text = "UNLICENSED" }
authors = [{ name = "Mohamed Awad", email = "m7md.awad.1999@gmail.com" }]
dependencies = [
    "fastmcp==3.4.6",
    "pillow==11.3.0",
    "pydantic==2.13.4",
]

[project.scripts]
# Thin console entry points over the module `main` functions the README already
# documents. Named rather than module paths because a console script is the
# professional public surface of an installed distribution; each delegates and
# owns no logic of its own. The research commands are deliberately absent: they
# live outside the distributed package and are development evidence, not
# something a tournament agent needs at play time.
mars777-agent = "mars777_police.__main__:main"
mars777-backend = "mars777_police.kit_backend_main:main"
mars777-gateway = "mars777_police.kit_gateway_main:main"
mars777-gui = "mars777_police.gui_main:main"
mars777-replay = "mars777_police.replay_main:main"
mars777-report = "mars777_police.report_main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mars777_police"]
# PEP 561: ship the typing marker, so an installed consumer of the public SDK
# gets the strict types this project is checked with rather than being told the
# package is untyped.
artifacts = ["src/mars777_police/py.typed"]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
]
# Optional, and deliberately not a runtime dependency: a tournament agent must
# never need a notebook stack to play a game. The notebook is an explanatory
# surface over `research/`, which computes everything and is fully tested, so
# nothing is lost if this group is never installed.
notebook = [
    "jupyter>=1.1,<2.0",
    "nbconvert>=7.16,<8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tools", "research"]
# Resolve `mars777_police` from source rather than from the installed wheel: the
# distribution ships no `py.typed` marker, so an importer would otherwise be told
# the package is untyped. Adding that marker is a packaging change and belongs to
# the packaging slice, not to a research stage.
mypy_path = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --cov --cov-report=term-missing --cov-fail-under=90"
markers = [
    "windows_known_limitation: the one native-Windows two-process exact-six stall, run non-gating on Windows and gating everywhere else",
]

[tool.coverage.run]
branch = true
source = ["mars777_police", "research"]

[tool.coverage.report]
show_missing = true
fail_under = 90
